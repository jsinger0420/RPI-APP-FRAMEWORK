[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-app-framework"
version = "0.1.5"
description = "A Python framework for building applications on all Raspberry Pi versions, including Pico."
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    {name = "John Singer", email = "john@singerlinks.com"}
]
keywords = ["raspberry-pi", "pico", "framework", "app-development", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Hardware"
]
dependencies = []

[project.optional-dependencies]
# GPIO on Raspberry Pi OS (all models incl. Pi 5). gpiozero picks the lgpio
# backend on the Pi 5; Raspberry Pi OS ships lgpio as python3-lgpio.
gpio = [
    "gpiozero>=2.0"
]
# I2C on Raspberry Pi OS (PCA9685, ADS1x15).
i2c = [
    "smbus2>=0.4"
]
# Audio on Raspberry Pi OS (I2SDACDeviceManager through ALSA). Building it needs the
# Debian packages python3-dev and libasound2-dev.
audio = [
    "pyalsaaudio>=0.9"
]
# Web server on Raspberry Pi OS (MicrodotManager). On the Pico, copy Microdot to /lib.
web = [
    "microdot>=2.0"
]
# Deprecated alias for "gpio" (was RPi.GPIO before 0.2.0); remove in 0.3.0.
pi = [
    "gpiozero>=2.0"
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Pure Python; lets CI serve a real HTTP request through MicrodotManager.
    "microdot>=2.0"
]
# Pinned so local runs match CI (.github/workflows/ci.yml).
dev = [
    "black==26.5.1",
    "ruff==0.16.9"
]

[project.urls]
Homepage = "https://github.com/jsinger0420/rpi-app-framework"
Repository = "https://github.com/jsinger0420/rpi-app-framework.git"
Documentation = "https://github.com/jsinger0420/rpi-app-framework/wiki"
"Bug Tracker" = "https://github.com/jsinger0420/rpi-app-framework/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[tool.setuptools.package-data]
"rpi_app_framework" = ["*.txt", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order (replaces isort), D docstrings
# (Google convention, ADR-001), B bugbear. No UP (pyupgrade): its rewrites can
# produce syntax MicroPython does not support.
select = ["E", "F", "W", "I", "D", "B"]
# E501: black owns line length; it only flags long strings and comments.
# D403: Google-style property docstrings start with the type ("str: ...").
ignore = ["E501", "D403"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Modules not yet converted to the 0.2.0 contract (ROADMAP Step 5). Remove a
# line when its module is converted.
"src/rpi_app_framework/MJPEGRequestHandler.py" = ["D"]
"src/rpi_app_framework/cameradevicemanager.py" = ["D"]
# Examples are rewritten in Step 6.
"examples/*" = ["D"]
