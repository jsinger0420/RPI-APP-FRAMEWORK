[build-system]
# 77+: SPDX "license" string and "license-files" (PEP 639).
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-app-framework"
# The version lives in src/rpi_app_framework/_version.py (ADR-012), so the Pico,
# which has no package metadata, reports the same __version__.
dynamic = ["version"]
description = "Application lifecycle and device managers for every Raspberry Pi, from the Pico (MicroPython) to the Pi 5."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "John Singer", email = "john@singerlinks.com"}
]
keywords = [
    "raspberry-pi", "pico", "micropython", "gpio", "gpiozero", "framework",
    "lifecycle", "servo", "motor", "sensor", "iot",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Hardware",
]
# The core (RPIApp, DeviceManager) needs nothing; each feature has an extra.
dependencies = []

[project.optional-dependencies]
# GPIO on Raspberry Pi OS (all models incl. Pi 5). gpiozero picks the lgpio
# backend on the Pi 5; Raspberry Pi OS ships lgpio as python3-lgpio.
gpio = [
    "gpiozero>=2.0"
]
# I2C on Raspberry Pi OS (PCA9685, ADS1x15).
i2c = [
    "smbus2>=0.4"
]
# Audio on Raspberry Pi OS (I2SDACDeviceManager through ALSA). Building it needs the
# Debian packages python3-dev and libasound2-dev.
audio = [
    "pyalsaaudio>=0.9; sys_platform == 'linux'"
]
# Web server on Raspberry Pi OS (MicrodotManager). On the Pico, copy Microdot to /lib.
web = [
    "microdot>=2.0"
]
# Everything above, for a Raspberry Pi. No camera extra: picamera2 must come from apt
# (python3-picamera2), because the pip package lacks the libcamera bindings.
all = [
    "rpi-app-framework[gpio,i2c,audio,web]"
]
# Deprecated alias for "gpio" (was RPi.GPIO before 0.2.0); remove in 0.3.0.
pi = [
    "gpiozero>=2.0"
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Pure Python; lets CI serve a real HTTP request through MicrodotManager.
    "microdot>=2.0"
]
# Pinned so local runs match CI (.github/workflows/ci.yml).
dev = [
    "black==26.5.1",
    "ruff==0.16.9"
]

[project.urls]
Homepage = "https://github.com/jsinger0420/RPI-APP-FRAMEWORK"
Documentation = "https://github.com/jsinger0420/RPI-APP-FRAMEWORK/tree/main/docs"
Repository = "https://github.com/jsinger0420/RPI-APP-FRAMEWORK"
Issues = "https://github.com/jsinger0420/RPI-APP-FRAMEWORK/issues"
Changelog = "https://github.com/jsinger0420/RPI-APP-FRAMEWORK/blob/main/CHANGELOG.md"
Blog = "https://singerlinks.com/category/python/rpi-app-framework/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "rpi_app_framework._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order (replaces isort), D docstrings
# (Google convention, ADR-001), B bugbear. No UP (pyupgrade): its rewrites can
# produce syntax MicroPython does not support.
select = ["E", "F", "W", "I", "D", "B"]
# E501: black owns line length; it only flags long strings and comments.
# D403: Google-style property docstrings start with the type ("str: ...").
ignore = ["E501", "D403"]

[tool.ruff.lint.pydocstyle]
convention = "google"
