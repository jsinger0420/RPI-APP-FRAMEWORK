# Build and publish to PyPI when a version tag is pushed, e.g.:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Uses PyPI Trusted Publishing (OIDC): no API token or .pypirc is needed.
# One-time setup, see docs/RELEASING.md:
#   1. PyPI > rpi-app-framework > Settings > Publishing > add a GitHub
#      publisher: owner jsinger0420, repository rpi-app-framework,
#      workflow publish.yml, environment pypi.
#   2. GitHub > Settings > Environments > create "pypi" (optionally require
#      a reviewer so each release waits for your approval).
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check tag matches pyproject.toml version
        shell: python
        run: |
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + version:
              sys.exit(f"Tag {tag} does not match pyproject.toml version {version} (expected v{version})")
          print(f"Releasing {version}")
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rpi-app-framework/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
